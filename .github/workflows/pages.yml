# Publishes the site to GitHub Pages on every push to the main branch.
#
# One-time setup (repository admin): Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". Then re-run this workflow (Actions tab).
#
# STAGING: every page is marked "noindex" so search engines don't list this
# preview as the course's website. Remove the "Mark as staging" step when the
# town approves the site and it moves to thegriffgolf.org.

name: Deploy site to GitHub Pages

on:
  push:
    branches: ["claude/tender-hawking-28smna"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Assemble the public site
        run: |
          mkdir _site
          cp -r *.html css js assets v1 _site/

      - name: Mark as staging (noindex)
        run: |
          find _site -name '*.html' -print0 | xargs -0 sed -i 's|<meta charset="utf-8">|<meta charset="utf-8">\n  <meta name="robots" content="noindex, nofollow">|'
          missing=$(grep -L 'name="robots"' $(find _site -name '*.html') || true)
          if [ -n "$missing" ]; then echo "noindex missing in: $missing"; exit 1; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
